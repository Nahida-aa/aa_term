[workspace]
resolver = "3"
members = ["packages/aa_editor_iced","packages/aa_term", "packages/aa_terminal_core", "packages/aa_terminal_iced", "packages/aa_terminal_view_iced", "packages/agent_ui", "packages/project", "packages/sidebar", "packages/workspace", "packages/worktree"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# 终端模型层（配色解析、网格、PTY）。不依赖 iced，可独立测试。
aa_terminal_core = { path = "packages/aa_terminal_core" }
aa_terminal_iced = { path = "packages/aa_terminal_iced" }
# canvas 是 feature-gated（iced_widget 里 `#[cfg(feature = "canvas")]`），
# 默认 feature 不含它，终端网格必须显式开启。
iced = { version = "0.14.0", features = ["canvas"] }

alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
vte = { version = "0.15.0", features = ["ansi"] }
# 颜色类型来自 gpui_learn 的 aa_theme_core（Hsla / Rgba / OKLab），
# 与 AAgent 侧共享同一份实现，避免终端与编辑器算出不同的颜色。
# 用相对路径而非绝对路径：两个仓库是同级目录。
aa_theme_core = { path = "../gpui_learn/packages/aa/aa_theme/aa_theme_core" }
