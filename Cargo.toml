[workspace]
resolver = "3"
members = ["packages/aa_editor_iced","packages/aa_term", "packages/aa_terminal_core", "packages/aa_terminal_iced", "packages/aa_terminal_view_iced", "packages/agent_ui", "packages/project", "packages/search", "packages/setting/settings", "packages/setting/settings_ui", "packages/sidebar", "packages/title_bar", "packages/workspace", "packages/worktree"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# 终端模型层（配色解析、网格、PTY）。不依赖 iced，可独立测试。
aa_terminal_core = { path = "packages/aa_terminal_core" }
aa_terminal_iced = { path = "packages/aa_terminal_iced" }
# 通用查找栏 + adapter 契约：终端与将来的编辑器共用一条（对齐 Zed 的 search）。
search = { path = "packages/search" }
# 侧边栏这一层：agent_ui 出线程元数据、workspace 管外壳与拖拽、sidebar 画列表。
agent_ui = { path = "packages/agent_ui" }
workspace = { path = "packages/workspace" }
sidebar = { path = "packages/sidebar" }
# 标题栏**内容**（File/Edit… 菜单、项目名、分支）—— 对应 AAgent 的同名 crate；
# 窗口框架（拖拽、窗口按钮）在 aa_ui_iced 里，两者分开与上游一致。
title_bar = { path = "packages/title_bar" }
# 工作树：从某个目录找到仓库根、读当前分支（标题栏上的项目名/分支要它）。
worktree = { path = "packages/worktree" }
# canvas 是 feature-gated（iced_widget 里 #[cfg(feature = "canvas")]），
# 默认 feature 不含它，终端网格必须显式开启。
# tokio：iced::time::every 只在 tokio/smol/wasm32 三个后端之一下可用，
# 用于驱动光标闪烁。tree 里已有 tokio，选它不额外增加依赖。
iced = { version = "0.14.0", features = ["canvas", "tokio"] }
# 实测 cell 宽失败时的告警；本来就是终端的调试基础设施。
tracing = "0.1"
# 订阅器。没有它，`tracing::debug!` 这些宏一行都不会输出 —— iced 自己不装。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iced_graphics = "0.14.0"

alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
vte = { version = "0.15.0", features = ["ansi"] }
# 颜色类型来自 gpui_learn 的 aa_theme_core：与 AAgent / gpui 侧共享同一份
# Hsla / Rgba / OKLab 实现，避免终端与编辑器算出不同的颜色。
#
# 照 AAgent 的做法：声明里写 git + 包名，再用 [patch] 把 git 源替换成本地
# 路径。这样 CI 拉 git rev、本地改 gpui_learn 立刻生效，且不会出现一份依赖
# 同时来自两个源导致的类型不匹配。
aa_theme_core = { git = "https://github.com/Nahida-aa/gpui_learn", rev = "3e62bc37521872549cae87236d726c9ece2af71a" }
# APCA 对比度兜底：框架无关的颜色算法，gpui 与 iced 共用同一份。
aa_ui_core = { git = "https://github.com/Nahida-aa/gpui_learn", rev = "3e62bc37521872549cae87236d726c9ece2af71a" }
# iced 侧的共享 UI 组件（`ThreadItem` ……），对应 gpui 侧的 aa_gpui_kit_ui / Zed 的
# crates/ui：组件放这里而不是塞进 app，编辑器、播放器将来共用同一份。
aa_ui_iced = { git = "https://github.com/Nahida-aa/gpui_learn", rev = "3e62bc37521872549cae87236d726c9ece2af71a" }
# iced 侧的主题：zed 语义色令牌（`surface_background` / `ghost_element_hover` …）
# 的 iced 版本，色值与 gpui 侧 aa_theme_gpui 同源。
aa_theme_iced = { git = "https://github.com/Nahida-aa/gpui_learn", rev = "3e62bc37521872549cae87236d726c9ece2af71a" }

# 把 gpui_learn 的 git 依赖指到本地工作副本：改 aa_theme_core 后无需等推送，
# cargo 就能看到改动（与 AAgent 的同款配置）。
[patch."https://github.com/Nahida-aa/gpui_learn.git"]
aa_theme_core = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/aa/theme/aa_theme_core" }
aa_ui_core = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/aa/ui/aa_ui_core" }
aa_ui_iced = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/aa/ui/aa_ui_iced" }
aa_theme_iced = { path = "/home/aa/repos/ide_ls/gpui_learn/packages/aa/theme/aa_theme_iced" }
