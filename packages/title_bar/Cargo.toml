[package]
name = "title_bar"
version = "0.1.0"
edition.workspace = true

[dependencies]
# 取色走 zed 语义令牌（`ghost_element_hover` / `text_muted`…）。
aa_theme_iced.workspace = true
# 菜单本体复用共享组件（与线程行的右键菜单同一个 `ContextMenu`）。
aa_ui_iced.workspace = true
# 项目名与当前分支：从目录往上找仓库根、读 `.git/HEAD`。
worktree.workspace = true
iced.workspace = true

[dev-dependencies]
iced_test = "0.14.0"
