[package]
name = "aa_terminal_core"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Term/Grid/tty 都直接用：解析与 PTY 都不该自己重造。
alacritty_terminal.workspace = true
# 颜色类型与 AAgent / gpui 侧共用一份 Hsla 实现。
aa_theme_core.workspace = true
# 只为 mpsc：UI 线程与 alacritty 事件循环线程之间传事件。
# 只为 mpsc：UI 线程与 alacritty 事件循环线程之间传事件。
futures = "0.3"
# 键盘事件的类型定义；只依赖 core::keyboard 那部分，不引整个 widget 栈。
iced_core = "0.14.0"
# 只在 unix 上有 PTY；windows 上这些依赖用不到。
# vte 的 ansi Parser 是跨平台的：缓冲区层要靠它把字节喂进 Term。
vte.workspace = true

[target.'cfg(unix)'.dependencies]
# 仅 unix 需要：PTY 相关。

