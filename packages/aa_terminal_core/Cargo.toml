[package]
name = "aa_terminal_core"
version = "0.1.0"
edition.workspace = true

[dependencies]
# 只用 alacritty 的**类型**与 tty（PTY）模块，不碰它的 Term/Grid ——
# 后者属于缓冲区/解析层，等真正接线时再引入。
# 保持本 crate 的绝大部分能在不起 iced、不 fork 进程的前提下充分测试。
alacritty_terminal.workspace = true
# 颜色类型与 AAgent / gpui 侧共用一份 Hsla 实现。
aa_theme_core.workspace = true
# 只在 unix 上有 PTY；windows 上这些依赖用不到。
[target.'cfg(unix)'.dependencies]
vte.workspace = true

