[package]
name = "aa_terminal_iced"
version = "0.1.0"
edition.workspace = true

[dependencies]
aa_terminal_core.workspace = true
aa_theme_core.workspace = true
# 主题令牌（palette::from_theme 从这里取终端配色）。zed 那边 terminal crate 也
# 直接依赖 theme crate，分层一致。
aa_theme_iced.workspace = true
iced = { workspace = true, features = ["canvas"] }
# 实测 cell 宽要靠 iced_graphics 的 Paragraph；`iced::graphics` 被刻意隐藏
# （`mod graphics {}`），拿不到。
iced_graphics = { workspace = true }
# Paragraph 的 Spec 类型（LineHeight/Shaping/Text）都出自这里。
iced_core = "0.14.0"
aa_ui_core.workspace = true
# 通用查找栏 + adapter 契约：终端侧只实现 `SearchableItem`。
search.workspace = true
tracing.workspace = true


[dev-dependencies]
# headless UI 测试：能模拟点击/输入并断言控件树，比截屏可靠。
iced_test = "0.14.0"
