[package]
name = "aa_term"
version = "0.1.0"
edition.workspace = true

[dependencies]
aa_terminal_core.workspace = true
aa_terminal_iced.workspace = true
aa_theme_core.workspace = true
iced.workspace = true

[dev-dependencies]
# headless UI 测试。
iced_test = "0.14.0"

[package.metadata.bundle-dev]
icon = ["resources/app-icon-dev@2x.png", "resources/app-icon-dev.png"]
identifier = "dev.aa.Omi-Dev"
name = "Omi Dev"
category = "Developer Tool"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
osx_url_schemes = ["omi"]

[package.metadata.bundle-stable]
icon = ["resources/app-icon@2x.png", "resources/app-icon.png"]
identifier = "dev.aa.Omi"
name = "Omi"
category = "Developer Tool"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
osx_url_schemes = ["omi"]
