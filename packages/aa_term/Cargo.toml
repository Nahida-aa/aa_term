[package]
name = "aa_term"
version = "0.1.0"
edition.workspace = true

[dependencies]
# app 持有主题（深浅两套），渲染时传给侧边栏与菜单。
aa_theme_iced.workspace = true
# 共享 iced 组件（右键菜单等），与 gpui 侧 `aa_ui_zed` 同源。
aa_ui_iced.workspace = true
aa_terminal_core.workspace = true
aa_terminal_iced.workspace = true
# 通用查找栏：`TerminalSearch` 把它接到终端上，app 只做消息映射。
search.workspace = true
# 线程侧边栏三件套：元数据（agent_ui）、外壳与拖拽（workspace）、列表（sidebar）。
agent_ui.workspace = true
workspace.workspace = true
sidebar.workspace = true
# 标题栏内容（菜单栏 + 项目名 + 分支）；窗口框架在 aa_ui_iced。
title_bar.workspace = true
aa_theme_core.workspace = true
iced.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 「新建线程」要打时间戳（与 agent_ui 的 `ThreadMetadata` 同一个类型）。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# iced::time 只公开周期订阅 every，没有一次性定时器；暂停闪烁后的「500ms
# 后恢复」需要一次性 sleep。用树里已有的 tokio，不新增依赖。
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
# headless UI 测试。
iced_test = "0.14.0"

[package.metadata.bundle-dev]
icon = ["resources/app-icon-dev@2x.png", "resources/app-icon-dev.png"]
identifier = "dev.aa.Omi-Dev"
name = "Omi Dev"
category = "Developer Tool"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
osx_url_schemes = ["omi"]

[package.metadata.bundle-stable]
icon = ["resources/app-icon@2x.png", "resources/app-icon.png"]
identifier = "dev.aa.Omi"
name = "Omi"
category = "Developer Tool"
osx_minimum_system_version = "10.15.7"
osx_info_plist_exts = ["resources/info/*"]
osx_url_schemes = ["omi"]
